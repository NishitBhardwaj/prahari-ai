[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "prahari-backend"
version = "1.0.0"
description = "Prahari AI – Crime Intelligence Platform Backend (Karnataka Police)"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Config & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "geoalchemy2>=0.16.0",

    # Neo4j
    "neo4j>=5.27.0",

    # Qdrant
    "qdrant-client>=1.12.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",

    # AI / ML
    "scikit-learn>=1.6.0",
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",

    # LangChain + Gemini for RAG
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-qdrant>=0.2.0",
    "google-generativeai>=0.8.0",

    # PDF generation
    "reportlab>=4.2.0",
    "weasyprint>=63.0",

    # Utils
    "loguru>=0.7.2",
    "python-dateutil>=2.9.0",
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "faker>=33.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
